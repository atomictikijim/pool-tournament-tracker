name: CI

# The app is a Windows WPF executable (net8.0-windows) and tests/PoolTournamentManager.App.Tests
# references it directly, so the test host needs Microsoft.WindowsDesktop.App - the whole suite
# only runs on a Windows agent.
on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore PoolTournamentManager.sln

      - name: Build
        run: dotnet build PoolTournamentManager.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test PoolTournamentManager.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
